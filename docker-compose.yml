services:
  postgres:
    image: postgres:16
    container_name: belasting-db
    environment:
      POSTGRES_DB: belastingdb
      POSTGRES_USER: BelastingDataBaseUser
      POSTGRES_PASSWORD: 123Bealsting
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  app:
    build: .
    container_name: belasting-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/belastingdb
      SPRING_DATASOURCE_USERNAME: BelastingDataBaseUser
      SPRING_DATASOURCE_PASSWORD: 123Bealsting
    depends_on:
      - postgres

volumes:
  pgdata:
